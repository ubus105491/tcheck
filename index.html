<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班次驗票紀錄查詢</title>
  <style>
    :root {
      --primary: #b45309;
      --primary-light: #fffbeb;
      --bg: #fcfaf8;
      --surface: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --sub: #78716c;
      --row-hover: #f5f5f4;
    }

    body.dark-mode {
      --primary: #fbbf24;
      --primary-light: #292524;
      --bg: #121212;
      --surface: #1e1e1e;
      --border: #333333;
      --text: #f5f5f4;
      --sub: #a8a29e;
      --row-hover: #262626;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--surface); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); transition: background 0.3s, border 0.3s; }
    
    h2 { margin-top: 0; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .theme-toggle-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text); padding: 6px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px; }
    label { font-size: 13px; font-weight: bold; color: var(--sub); display: block; margin-bottom: 6px; }
    input[type="date"], select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-weight: bold; background: var(--surface); color: var(--text); outline: none; }
    
    .btn { padding: 10px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn:active { filter: brightness(0.9); }
    
    /* 統計摘要卡片 */
    .summary-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .summary-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
    .summary-val { font-size: 26px; font-weight: bold; color: var(--primary); margin-top: 4px; }

    /* 表格樣式 */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--primary-light); color: var(--primary); font-weight: 800; }
    tr:hover { background: var(--row-hover); }
    
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-normal { background: #e7e5e4; color: #292524; }
    .badge-luggage { background: #f3e8ff; color: #7e22ce; }
    .badge-qr { background: #ecfccb; color: #3f6212; }
    .badge-empty { background: #fef3c7; color: #92400e; }

    .route-section-title { font-size: 16px; font-weight: 800; color: var(--primary); margin: 20px 0 10px 0; border-bottom: 2px solid var(--primary); padding-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>
        <span>班次驗票紀錄查詢中心</span>
        <button class="theme-toggle-btn" onclick="toggleThemeMode()">切換深色模式</button>
      </h2>
      
      <div class="filter-grid">
        <div>
          <label>查詢日期：</label>
          <input type="date" id="queryDate">
        </div>
        <div>
          <label>選擇路線：</label>
          <select id="routeSelect">
            <option value="ALL">全部路線 (全部顯示)</option>
            <option value="台中">台中</option>
            <option value="朝專">朝專</option>
            <option value="宜蘭">宜蘭</option>
            <option value="宜直">宜直</option>
            <option value="機轉">機轉</option>
            <option value="99">99 (測試)</option>
          </select>
        </div>
        <div id="sortModeContainer">
          <label>排序方式 (限全部路線)：</label>
          <select id="sortModeSelect" onchange="fetchAndRenderData()">
            <option value="route">依路線分組排列</option>
            <option value="time">依發車時間先後排序</option>
          </select>
        </div>
      </div>
      
      <button class="btn" onclick="fetchAndRenderData()">立即查詢</button>
    </div>

    <!-- 數據摘要 -->
    <div class="summary-box" id="summaryBox" style="display:none;">
      <div class="summary-card">
        <label>總發車班次</label>
        <div class="summary-val" id="sumTrips">0</div>
      </div>
      <div class="summary-card">
        <label>總乘客人數 (不含行李)</label>
        <div class="summary-val" id="sumPassengers">0</div>
      </div>
      <div class="summary-card">
        <label>總登記行李數</label>
        <div class="summary-val" id="sumLuggage">0</div>
      </div>
    </div>

    <!-- 結果呈現區 -->
    <div class="card" id="resultCard">
      <h3 style="margin-top:0;">查詢結果明細</h3>
      <div id="resultContent" style="color: var(--sub); text-align: center; padding: 30px 0;">請點擊上方按鈕開始查詢</div>
    </div>
  </div>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbwxWZ8uKHWxO1Z1ngJ6hJZJOHlMrzz_21AcH5uuL4ALpfrLs8-6x-rXVlplspkKLLWR/exec";
    var AUTH_TOKEN = "8888"; 

    // 初始化深色模式
    function initTheme() {
      var savedTheme = localStorage.getItem("PDA_THEME") || "light";
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      }
    }
    initTheme();

    function toggleThemeMode() {
      document.body.classList.toggle("dark-mode");
      var isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("PDA_THEME", isDark ? "dark" : "light");
    }

    // 預設日期為今日
    document.getElementById('queryDate').value = new Date().toISOString().slice(0, 10);

    function formatRouteName(name) {
      if (!name) return "未指定";
      if (name === "99") return "99 (測試)";
      return name;
    }

    function fetchAndRenderData() {
      var dateVal = document.getElementById('queryDate').value;
      var routeVal = document.getElementById('routeSelect').value;
      var sortMode = document.getElementById('sortModeSelect').value;
      var container = document.getElementById('resultContent');
      var summaryBox = document.getElementById('summaryBox');

      if (!dateVal) {
        alert("請選擇查詢日期！");
        return;
      }

      container.innerHTML = "<div style='text-align:center; padding:30px; color:var(--sub);'>正在向雲端讀取資料中...</div>";
      summaryBox.style.display = "none";

      var fetchUrl = GAS_API_URL + "?token=" + AUTH_TOKEN;

      fetch(fetchUrl)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.status !== "success") {
            container.innerHTML = "<div style='color:#b91c1c; text-align:center;'>讀取失敗：" + (res.message || "未知錯誤") + "</div>";
            return;
          }

          var allData = res.data || [];
          
          // 1. 篩選出符合日期的資料
          var filtered = allData.filter(function(row) {
            var matchDate = (row.date === dateVal);
            var matchRoute = (routeVal === "ALL" || row.route === routeVal);
            return matchDate && matchRoute;
          });

          if (filtered.length === 0) {
            container.innerHTML = "<div style='text-align:center; padding:30px; color:var(--sub);'>查無符合條件的驗票紀錄</div>";
            return;
          }

          // 2. 統計摘要計算 (行李票獨立)
          var uniqueTrips = {};
          var passengerCount = 0;
          var luggageCount = 0;

          filtered.forEach(function(row) {
            var tripKey = row.date + "_" + row.route + "_" + row.tripTime;
            uniqueTrips[tripKey] = true;

            if (row.type === "行李票") {
              luggageCount++;
            } else if (row.type !== "空車駛離") {
              passengerCount++;
            }
          });

          document.getElementById('sumTrips').innerText = Object.keys(uniqueTrips).length;
          document.getElementById('sumPassengers').innerText = passengerCount;
          document.getElementById('sumLuggage').innerText = luggageCount;
          summaryBox.style.display = "grid";

          // 3. 渲染明細
          if (routeVal !== "ALL" || sortMode === "route") {
            // 依照路線分組呈現
            renderByRoute(filtered, container);
          } else {
            // 依時間先後排序呈現
            renderByTime(filtered, container);
          }

        })
        .catch(function(err) {
          container.innerHTML = "<div style='color:#b91c1c; text-align:center;'>連線錯誤：" + err + "</div>";
        });
    }

    // 依路線分組渲染
    function renderByRoute(data, container) {
      var groups = {};
      data.forEach(function(row) {
        var r = row.route || "未指定";
        if (!groups[r]) groups[r] = [];
        groups[r].push(row);
      });

      container.innerHTML = "";
      Object.keys(groups).sort().forEach(function(route) {
        var section = document.createElement('div');
        var title = document.createElement('div');
        title.className = "route-section-title";
        title.innerText = "路線: " + formatRouteName(route) + " (共 " + groups[route].length + " 筆紀錄)";
        section.appendChild(title);

        section.appendChild(createTable(groups[route]));
        container.appendChild(section);
      });
    }

    // 依發車時間先後全域排序渲染
    function renderByTime(data, container) {
      // 依照發車時間排序 (HH:mm)
      data.sort(function(a, b) {
        return (a.tripTime || "").localeCompare(b.tripTime || "");
      });

      container.innerHTML = "";
      var title = document.createElement('div');
      title.className = "route-section-title";
      title.innerText = "依發車時間先後全域排序 (共 " + data.length + " 筆紀錄)";
      container.appendChild(title);
      container.appendChild(createTable(data));
    }

    // 建立明細表格元件
    function createTable(rows) {
      var wrap = document.createElement('div');
      wrap.className = "table-container";

      var table = document.createElement('table');
      var thead = document.createElement('thead');
      thead.innerHTML = "<tr><th>發車時間</th><th>路線</th><th>票券類別</th><th>票號 / 狀態</th><th>刷入時間</th></tr>";
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      rows.forEach(function(row) {
        var tr = document.createElement('tr');
        
        var badgeClass = "badge-normal";
        if (row.type === "行李票") badgeClass = "badge-luggage";
        else if (row.type === "電子QR票") badgeClass = "badge-qr";
        else if (row.type === "空車駛離") badgeClass = "badge-empty";

        tr.innerHTML = "<td><b>" + (row.tripTime || "") + "</b></td>" +
                       "<td>" + formatRouteName(row.route) + "</td>" +
                       "<td><span class='badge " + badgeClass + "'>" + (row.type || "一般票") + "</span></td>" +
                       "<td style='font-family:monospace;'>" + (row.code || "") + "</td>" +
                       "<td style='font-family:monospace; color:var(--sub);'>" + (row.scanTime || "") + "</td>";
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }
  </script>
</body>
</html>
