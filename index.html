<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>班次調度管理中心</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --surface: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --sub: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #8b5cf6;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
    
    html {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 12px;
      /* 🌟 核心修正：動態視窗高度 + 底部超大安全緩衝區，確保最後一筆完整可見 */
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: calc(120px + env(safe-area-inset-bottom, 20px));
      background: var(--bg);
      color: var(--text);
      -webkit-overflow-scrolling: touch;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    h2, h3 { margin: 0 0 10px 0; }
    label { font-size: 13px; font-weight: bold; color: var(--sub); display: block; margin-bottom: 4px; }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn:active { filter: brightness(0.9); transform: scale(0.98); }
    .btn-secondary { background: var(--sub); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-purple { background: var(--purple); }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* 班次清單卡片排版 (手機專屬優化) */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .schedule-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .schedule-item.is-departed {
      background: #f8fafc;
      opacity: 0.85;
      border-left: 5px solid var(--purple);
    }

    .schedule-item.is-pending {
      border-left: 5px solid var(--primary);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-title {
      font-size: 16px;
      font-weight: 900;
    }

    .item-time {
      font-family: monospace;
      font-size: 18px;
      font-weight: 900;
      color: var(--primary);
    }

    .item-fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .item-field-box {
      background: #f1f5f9;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .item-field-label { color: var(--sub); font-size: 11px; margin-bottom: 2px; }
    .item-field-value { font-weight: bold; color: var(--text); }

    .item-footer-btns {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .tag-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .tag-departed { background: #ede9fe; color: #6d28d9; }
    .tag-pending { background: #e0f2fe; color: #0369a1; }
    .tag-delay { background: #fef3c7; color: #92400e; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
    }
    .modal-box {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 編輯/指派彈窗 -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modalTripTitle" style="margin-top:0;">班次調度指派</h3>
      <input type="hidden" id="modalDate">
      <input type="hidden" id="modalRoute">
      <input type="hidden" id="modalTripTime">

      <label>指派車號：</label>
      <input type="text" id="modalBusId" placeholder="例：KKA-1234">

      <label>駕駛姓名/編號：</label>
      <input type="text" id="modalDriverId" placeholder="例：王小明 (0582)">

      <label>預計延誤 (分鐘)：</label>
      <input type="number" id="modalDelayMinutes" placeholder="0" min="0">

      <label>實際發車時間 (留空為未發車)：</label>
      <input type="time" id="modalActualTime">

      <label>調度備註：</label>
      <textarea id="modalRemark" rows="2" placeholder="例：支援車、加班車"></textarea>

      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
        <button class="btn btn-success" onclick="saveScheduleFromModal()">儲存更新</button>
      </div>
    </div>
  </div>

  <div class="container">
    
    <div class="header-box">
      <h2>🚍 調度管理中心</h2>
      <span id="syncStatusText" style="font-size:12px; color:var(--sub); font-weight:bold;">就緒</span>
    </div>

    <!-- 頂部查詢與切換 -->
    <div class="card">
      <div class="filter-grid">
        <div>
          <label>查詢日期：</label>
          <input type="date" id="queryDate" onchange="fetchData()">
        </div>
        <div>
          <label>快速切換：</label>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-secondary" style="padding:10px 4px; font-size:13px;" onclick="setQueryDateToday()">今日</button>
            <button class="btn btn-secondary" style="padding:10px 4px; font-size:13px;" onclick="setQueryDateTomorrow()">明日</button>
          </div>
        </div>
      </div>

      <div class="action-grid">
        <button class="btn btn-purple" onclick="fetchData()">🔄 重新整理</button>
        <button class="btn btn-warning" onclick="openAddTripModal()">➕ 單筆新增班次</button>
      </div>
    </div>

    <!-- 班次清單 -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 14px 4px 6px 4px;">
      <h3 style="margin:0; font-size:16px;">當日調度排班表</h3>
      <span id="tripCountBadge" style="font-size:12px; font-weight:bold; color:var(--sub);">0 班次</span>
    </div>

    <div id="scheduleContainer" class="schedule-list"></div>

  </div>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbwxWZ8uKHWxO1Z1ngJ6hJZJOHlMrzz_21AcH5uuL4ALpfrLs8-6x-rXVlplspkKLLWR/exec";
    var AUTH_TOKEN = "8888";

    function getTodayStr() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
    }

    function setQueryDateToday() {
      document.getElementById('queryDate').value = getTodayStr();
      fetchData();
    }

    function setQueryDateTomorrow() {
      var d = new Date();
      d.setDate(d.getDate() + 1);
      document.getElementById('queryDate').value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
      fetchData();
    }

    document.getElementById('queryDate').value = getTodayStr();

    var cachedSchedules = [];
    var cachedTickets = [];

    function fetchData() {
      var qDate = document.getElementById('queryDate').value;
      if (!qDate) return;

      var statusText = document.getElementById('syncStatusText');
      statusText.innerText = "讀取中...";

      fetch(GAS_API_URL + "?token=" + AUTH_TOKEN)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.status !== "success") {
            statusText.innerText = "讀取失敗";
            return;
          }
          cachedSchedules = res.schedules || [];
          cachedTickets = res.tickets || [];
          renderList();
          statusText.innerText = "更新於 " + new Date().toTimeString().slice(0, 8);
        })
        .catch(function(err) {
          statusText.innerText = "連線異常";
        });
    }

    function renderList() {
      var qDate = document.getElementById('queryDate').value;
      var container = document.getElementById('scheduleContainer');
      container.innerHTML = "";

      var daySchedules = cachedSchedules.filter(function(s) { return s.date === qDate; });
      document.getElementById('tripCountBadge').innerText = daySchedules.length + " 班次";

      if (daySchedules.length === 0) {
        container.innerHTML = "<div style='text-align:center; padding:30px; color:var(--sub); font-size:14px; background:#fff; border-radius:10px; border:1px dashed var(--border);'>本日尚無任何排班紀錄</div>";
        return;
      }

      // 嚴格依發車時間由早到晚排序
      daySchedules.sort(function(a, b) {
        return (a.tripTime || "").localeCompare(b.tripTime || "");
      });

      daySchedules.forEach(function(s, idx) {
        var isDeparted = s.actualTime && s.actualTime.trim() !== "";
        var card = document.createElement('div');
        card.className = "schedule-item " + (isDeparted ? "is-departed" : "is-pending");

        // 統計該班次刷票人數
        var passCount = 0;
        cachedTickets.forEach(function(t) {
          if (t.date === s.date && t.route === s.route && t.tripTime === s.tripTime && t.type !== "行李票" && t.type !== "空車駛離") {
            passCount++;
          }
        });

        var statusTag = isDeparted 
          ? "<span class='tag-badge tag-departed'>已實發 " + s.actualTime + "</span>"
          : (s.delayMinutes > 0 ? "<span class='tag-badge tag-delay'>延後 +" + s.delayMinutes + "分</span>" : "<span class='tag-badge tag-pending'>登車/等待中</span>");

        card.innerHTML = 
          "<div class='item-top'>" +
            "<div class='item-title'>[" + s.route + "] " + statusTag + "</div>" +
            "<div class='item-time'>" + s.tripTime + "</div>" +
          "</div>" +
          "<div class='item-fields-grid'>" +
            "<div class='item-field-box'><div class='item-field-label'>指派車號</div><div class='item-field-value'>" + (s.busId || "未指派") + "</div></div>" +
            "<div class='item-field-box'><div class='item-field-label'>指派駕駛</div><div class='item-field-value'>" + (s.driverId || "未指派") + "</div></div>" +
            "<div class='item-field-box'><div class='item-field-label'>目前載客</div><div class='item-field-value' style='color:#10b981;'>" + passCount + " 人</div></div>" +
            "<div class='item-field-box'><div class='item-field-label'>調度備註</div><div class='item-field-value'>" + (s.remark || "-") + "</div></div>" +
          "</div>" +
          "<div class='item-footer-btns'>" +
            "<button class='btn btn-secondary' style='padding:6px;' onclick='openEditModal(" + idx + ")'>✏️ 指派/編輯</button>" +
            "<button class='btn btn-danger' style='width:auto; padding:6px 12px;' onclick='deleteTrip(\"" + s.date + "\", \"" + s.route + "\", \"" + s.tripTime + "\")'>刪除</button>" +
          "</div>";

        container.appendChild(card);
      });
    }

    function openEditModal(idx) {
      var qDate = document.getElementById('queryDate').value;
      var daySchedules = cachedSchedules.filter(function(s) { return s.date === qDate; });
      daySchedules.sort(function(a, b) { return (a.tripTime || "").localeCompare(b.tripTime || ""); });
      var item = daySchedules[idx];

      document.getElementById('modalTripTitle').innerText = "調度指派：" + item.date + " " + item.route + " " + item.tripTime;
      document.getElementById('modalDate').value = item.date;
      document.getElementById('modalRoute').value = item.route;
      document.getElementById('modalTripTime').value = item.tripTime;
      document.getElementById('modalBusId').value = item.busId || "";
      document.getElementById('modalDriverId').value = item.driverId || "";
      document.getElementById('modalDelayMinutes').value = item.delayMinutes || 0;
      document.getElementById('modalActualTime').value = item.actualTime || "";
      document.getElementById('modalRemark').value = item.remark || "";

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveScheduleFromModal() {
      var payload = {
        token: AUTH_TOKEN,
        action: "updateSchedule",
        date: document.getElementById('modalDate').value,
        route: document.getElementById('modalRoute').value,
        tripTime: document.getElementById('modalTripTime').value,
        busId: document.getElementById('modalBusId').value.trim(),
        driverId: document.getElementById('modalDriverId').value.trim(),
        delayMinutes: parseInt(document.getElementById('modalDelayMinutes').value) || 0,
        actualTime: document.getElementById('modalActualTime').value,
        remark: document.getElementById('modalRemark').value.trim()
      };

      closeEditModal();
      document.getElementById('syncStatusText').innerText = "儲存中...";

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function() {
        setTimeout(fetchData, 800);
      }).catch(function(err) {
        alert("儲存失敗：" + err);
      });
    }

    function deleteTrip(date, route, tripTime) {
      if (!confirm("確定要刪除班次 [" + date + " " + route + " " + tripTime + "] 嗎？\n此動作將一併清除該班次所有驗票紀錄！")) return;

      var payload = {
        token: AUTH_TOKEN,
        action: "deleteSchedule",
        date: date,
        route: route,
        tripTime: tripTime
      };

      document.getElementById('syncStatusText').innerText = "刪除中...";

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function() {
        setTimeout(fetchData, 800);
      }).catch(function(err) {
        alert("刪除失敗：" + err);
      });
    }

    function openAddTripModal() {
      var route = prompt("請輸入路線名稱 (例：台中、朝專、宜蘭)：");
      if (!route) return;
      var time = prompt("請輸入發車時間 (例：0800 或 08:00)：");
      if (!time) return;

      time = time.trim();
      if (time.length === 4 && time.indexOf(":") === -1) {
        time = time.slice(0, 2) + ":" + time.slice(2, 4);
      }

      var payload = {
        token: AUTH_TOKEN,
        action: "updateSchedule",
        date: document.getElementById('queryDate').value,
        route: route.trim(),
        tripTime: time,
        busId: "",
        driverId: "",
        delayMinutes: 0,
        actualTime: "",
        remark: "手動新增"
      };

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function() {
        setTimeout(fetchData, 800);
      });
    }

    fetchData();
  </script>
</body>
</html>
