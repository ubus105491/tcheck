<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國道客運班次調度暨驗票監控中心</title>
  <style>
    :root {
      --bg-base: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #9ca3af;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-amber: #fbbf24;
      --accent-emerald: #34d399;
      --accent-purple: #c084fc;
      --accent-rose: #f43f5e;
      --input-bg: #0f172a;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; touch-action: manipulation; }
    body { margin: 0; padding: 0; background: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .top-navbar {
      background: #111827;
      border-bottom: 1.5px solid var(--card-border);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-title { font-size: 16px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .nav-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .main-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .left-sidebar {
      width: 380px;
      border-right: 1.5px solid var(--card-border);
      background: #131d31;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }
    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #182235;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trip-nav-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 4px solid #64748b;
      transition: all 0.15s;
    }
    .trip-nav-card:hover { background: #27354f; border-color: var(--primary); }
    .trip-nav-card.active { background: #1e3a5f; border-left-color: var(--primary); border-color: var(--primary); }
    .trip-nav-card.is-delayed { border-left-color: var(--accent-amber); }
    .trip-nav-card.is-ontime { border-left-color: var(--accent-emerald); }
    
    .t-row-top { display: flex; justify-content: space-between; align-items: center; }
    .t-time { font-family: monospace; font-size: 16px; font-weight: 900; color: var(--primary); }
    .t-route-tag { font-size: 13px; font-weight: 800; background: rgba(56, 189, 248, 0.15); color: var(--primary); padding: 2px 6px; border-radius: 4px; }
    .t-line-branch { font-size: 11px; background: rgba(255,255,255,0.1); color: #cbd5e1; padding: 2px 4px; border-radius: 3px; font-weight: bold; }

    .t-row-mid { font-size: 13px; font-weight: bold; color: var(--text-main); display: flex; justify-content: space-between; }
    .t-row-bot { font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between; font-family: monospace; }

    .right-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 14px;
      gap: 12px;
      height: 100%;
    }

    .mobile-back-btn {
      display: none;
      background: #334155;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 4px;
      align-items: center;
      gap: 4px;
      width: fit-content;
    }

    .panel-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .panel-header {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .dispatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    label { font-size: 12px; font-weight: bold; color: var(--text-sub); display: block; margin-bottom: 3px; }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: bold;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .btn {
      padding: 7px 12px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn:active { filter: brightness(0.9); }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-emerald { background: var(--accent-emerald); color: #064e3b; }
    .btn-purple { background: var(--accent-purple); color: #3b0764; }
    .btn-amber { background: var(--accent-amber); color: #451a03; }
    .btn-danger { background: var(--accent-rose); color: #fff; }

    .table-scroll-container {
      overflow-x: auto;
      max-height: 260px;
    }
    .ticket-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; min-width: 380px; }
    .ticket-table th, .ticket-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--card-border); }
    .ticket-table th { background: rgba(0, 0, 0, 0.25); color: var(--text-sub); font-weight: 800; }
    .ticket-table tr:hover { background: rgba(255, 255, 255, 0.03); }

    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    .badge-normal { background: #334155; color: #f8fafc; }
    .badge-luggage { background: #581c87; color: #f3e8ff; }
    .badge-qr { background: #1e3a1e; color: #bef264; border: 1px solid #365314; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 12px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .qr-ticket-card { border-radius: 10px; border: 2px solid var(--card-border); padding: 14px; text-align: center; margin-bottom: 12px; background: #0b0f19; }
    .qr-ticket-card.type-luggage { background: #2e1065; border-color: #a855f7; }
    .qr-ticket-card.type-qr { background: #142805; border-color: #65a30d; }

    #qrCanvasContainer { display: flex; justify-content: center; margin: 10px 0; min-height: 180px; }
    #qrCanvasContainer canvas { border: 6px solid #fff; border-radius: 6px; max-width: 100%; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .brand-title { font-size: 15px; }
      .nav-tools { width: 100%; justify-content: space-between; }
      .nav-tools input[type="date"] { flex: 1; min-width: 110px; }

      .main-workspace {
        display: block;
        position: relative;
      }

      .left-sidebar {
        width: 100%;
        border-right: none;
        display: flex;
      }

      .right-content {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 10;
        display: none;
      }

      body.mobile-view-detail .left-sidebar { display: none; }
      body.mobile-view-detail .right-content { display: flex; }
      body.mobile-view-detail .mobile-back-btn { display: inline-flex; }

      .dispatch-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- 0. 系統登入遮罩 (帳號 2347 / 密碼 1299) -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 320px; text-align: center;">
      <h3 style="margin-top: 0; color: var(--primary);">調度系統身分驗證</h3>
      <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 14px;">請輸入調度員專屬授權帳號與密碼</div>
      
      <div style="text-align: left; margin-bottom: 8px;">
        <label>調度員工號 (帳號)：</label>
        <input type="text" id="loginUser" placeholder="請輸入 4 碼工號" autocomplete="off">
      </div>
      <div style="text-align: left; margin-bottom: 14px;">
        <label>授權通行碼 (密碼)：</label>
        <input type="password" id="loginPass" placeholder="請輸入密碼">
      </div>

      <button class="btn btn-emerald" style="width: 100%; padding: 10px;" onclick="executeLogin()">確認登入系統</button>
      <div id="loginErrMsg" style="color: var(--accent-rose); font-size: 12px; font-weight: bold; margin-top: 8px;" class="hidden">帳號或密碼錯誤！</div>
    </div>
  </div>

  <!-- 1. 頂部工具列 -->
  <header class="top-navbar">
    <div class="brand-title">
      <span>🚍</span> 國道客運排班調度中心
    </div>
    <div class="nav-tools">
      <input type="date" id="navDateInput" onchange="handleDateChange()">
      <button class="btn btn-purple" onclick="openCreateTripModal('single')">+ 排班</button>
      <button class="btn btn-amber" onclick="openCreateTripModal('batch')">⚡ 批次</button>
      <button class="btn btn-secondary" onclick="syncAllCloudData()">🔄 同步</button>
    </div>
  </header>

  <!-- 2. 主工作區 (電腦雙欄 / 手機動態切換) -->
  <main class="main-workspace">
    
    <!-- 左側：班次導航清單 -->
    <aside class="left-sidebar">
      <div class="sidebar-header">
        <div style="display: flex; gap: 6px;">
          <input type="text" id="leftSearchInput" placeholder="🔍 搜尋車號/路線/時間..." oninput="renderSidebarList()">
          <select id="leftSortSelect" style="width: 90px;" onchange="renderSidebarList()">
            <option value="time_asc">時間 ↑</option>
            <option value="time_desc">時間 ↓</option>
            <option value="route">路線</option>
          </select>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); font-weight: bold;">
          <span id="tripCountSummary">共 0 班次</span>
          <span id="syncTimestamp" style="font-family: monospace;">未同步</span>
        </div>
      </div>

      <div class="sidebar-list" id="sidebarTripList"></div>
    </aside>

    <!-- 右側：調度與驗票工作台 -->
    <section class="right-content">
      
      <!-- 手機專用：返回班次清單按鈕 -->
      <button class="mobile-back-btn" onclick="backToMobileList()">⬅ 返回班次清單</button>

      <!-- 區塊 A：當前班次基本資訊與調度指派 -->
      <div class="panel-box" id="dispatchPanel">
        <div class="panel-header">
          <div>
            <span id="currentTripHeading" style="font-size: 16px; font-weight: 900;">請從左側選擇班次</span>
            <span id="currentBranchTag" class="t-line-branch" style="margin-left: 4px;"></span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="btn btn-danger" id="btnDeleteTrip" onclick="confirmDeleteCurrentTrip()">🗑️ 刪除</button>
            <button class="btn btn-emerald" id="btnSaveDispatch" onclick="saveCurrentDispatchInfo()">💾 儲存</button>
          </div>
        </div>

        <div class="dispatch-grid">
          <div>
            <label>指派車牌：</label>
            <input type="text" id="dispBusId" placeholder="例如: 982-FZ">
          </div>
          <div>
            <label>駕駛員編號/姓名：</label>
            <input type="text" id="dispDriverId" placeholder="例如: D082 王大明">
          </div>
          <div>
            <label>預計延誤 (分)：</label>
            <input type="number" id="dispDelay" value="0" min="0">
          </div>
          <div>
            <label>實際發車時間：</label>
            <input type="time" id="dispActualTime">
          </div>
          <div style="grid-column: 1 / -1;">
            <label>調度/運行異常備註：</label>
            <input type="text" id="dispRemark" placeholder="如：支援 2 車、西螺轉乘、國一事故改道等">
          </div>
        </div>
      </div>

      <!-- 區塊 B：載客即時概況 -->
      <div class="panel-box">
        <div class="panel-header">
          <span>📊 載客與行李統計</span>
          <span id="tripSummaryBadge" style="font-size: 12px; color: var(--text-sub);">登車 0 人 ｜ 行李 0 件</span>
        </div>
        <div style="display: flex; gap: 8px; font-family: monospace; font-size: 13px; font-weight: bold; flex-wrap: wrap;">
          <div style="background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; flex: 1; min-width: 80px;">
            一般: <span id="sumNormal" style="color: #fff;">0</span>
          </div>
          <div style="background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; flex: 1; min-width: 80px;">
            QR: <span id="sumQr" style="color: #bef264;">0</span>
          </div>
          <div style="background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; flex: 1; min-width: 80px;">
            行李: <span id="sumLuggage" style="color: #c084fc;">0</span>
          </div>
        </div>
      </div>

      <!-- 區塊 C：詳細驗票紀錄清單 -->
      <div class="panel-box" style="flex: 1; display: flex; flex-direction: column;">
        <div class="panel-header">
          <span>🎟️ 已刷入票券清單</span>
        </div>
        <div class="table-scroll-container">
          <table class="ticket-table">
            <thead>
              <tr>
                <th style="width: 40px;">序</th>
                <th style="width: 60px;">類別</th>
                <th>票號</th>
                <th style="width: 70px;">時間</th>
                <th style="width: 60px;">QR</th>
              </tr>
            </thead>
            <tbody id="ticketTableBody">
              <tr><td colspan="5" style="text-align: center; color: var(--text-sub); padding: 16px;">無刷票紀錄</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <!-- 3. 新增班次彈窗 -->
  <div id="createTripModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 style="margin-top: 0; color: var(--primary);" id="createModalTitle">新增班次排班</h3>
      
      <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 6px; margin-bottom: 8px;">
        <div>
          <label>發車日期：</label>
          <input type="date" id="newTripDate">
        </div>
        <div>
          <label>動線代碼：</label>
          <select id="newTripBranch">
            <option value="【主0】">【主0】主線</option>
            <option value="【支A】">【支A】支線</option>
            <option value="【支B】">【支B】支線</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom: 8px;">
        <label>路線代碼 (自動首選起訖站)：</label>
        <input type="text" id="newTripRouteInput" list="presetRouteDatalist" placeholder="輸入如 1610、1623" oninput="handleRouteInputChange()">
        <datalist id="presetRouteDatalist"></datalist>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px;">
        <div>
          <label>起點站：</label>
          <select id="newTripOriginSelect" onchange="handleStationSelectChange()"></select>
        </div>
        <div>
          <label>迄點站：</label>
          <select id="newTripDestSelect" onchange="handleStationSelectChange()"></select>
        </div>
      </div>

      <!-- 自訂站點輸入框 -->
      <div id="customStationInputGroup" class="hidden" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px;">
        <div>
          <label>手動輸入起點：</label>
          <input type="text" id="customOriginInput" placeholder="例如: 台北轉運站">
        </div>
        <div>
          <label>手動輸入迄點：</label>
          <input type="text" id="customDestInput" placeholder="例如: 高雄火車站">
        </div>
      </div>

      <div id="singleTimeGroup" style="margin-bottom: 12px;">
        <label>發車時間：</label>
        <input type="time" id="newSingleTime" value="08:00">
      </div>

      <div id="batchTimeGroup" style="margin-bottom: 12px;" class="hidden">
        <label>班次時間串 (如 0600 0730 空格分隔)：</label>
        <textarea id="newBatchTimes" rows="3" placeholder="例如: 0600 0630 0700 0730 0800 0930"></textarea>
      </div>

      <div style="display: flex; gap: 6px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeCreateTripModal()">取消</button>
        <button class="btn btn-emerald" style="flex: 1;" onclick="executeCreateTrip()">確認建立</button>
      </div>
    </div>
  </div>

  <!-- 4. 醒目 QR Code 檢視彈窗 -->
  <div id="qrModal" class="modal-overlay hidden" style="z-index: 10000;">
    <div class="modal-box" style="max-width: 320px; text-align: center;">
      <div id="qrWrapper" class="qr-ticket-card">
        <div style="font-size: 14px; font-weight: 800; margin-bottom: 4px;" id="qrTicketTypeTag">[一般票]</div>
        <div id="qrCanvasContainer"></div>
        <div style="font-family: monospace; font-weight: bold; font-size: 12px; word-break: break-all; margin-top: 6px;" id="qrTicketCode"></div>
      </div>
      <button class="btn btn-secondary" style="width: 100%;" onclick="closeQrModal()">關閉</button>
    </div>
  </div>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbwxWZ8uKHWxO1Z1ngJ6hJZJOHlMrzz_21AcH5uuL4ALpfrLs8-6x-rXVlplspkKLLWR/exec";
    var AUTH_TOKEN = "8888";

    var ROUTE_PRESETS = [
      { code: "1610", dir: "南下", origin: "台北", dest: "高雄", desc: "【1610】南下：台北 → 高雄" },
      { code: "1610", dir: "北上", origin: "高雄", dest: "台北", desc: "【1610】北上：高雄 → 台北" },
      { code: "1838", dir: "南下", origin: "台北", dest: "高雄", desc: "【1838】南下：台北 → 高雄" },
      { code: "1838", dir: "北上", origin: "高雄", dest: "台北", desc: "【1838】北上：高雄 → 台北" },
      { code: "1611", dir: "南下", origin: "台北", dest: "台南", desc: "【1611】南下：台北 → 台南" },
      { code: "1611", dir: "北上", origin: "台南", dest: "台北", desc: "【1611】北上：台南 → 台北" },
      { code: "1837", dir: "南下", origin: "台北", dest: "台南", desc: "【1837】南下：台北 → 台南" },
      { code: "1837", dir: "北上", origin: "台南", dest: "台北", desc: "【1837】北上：台南 → 台北" },
      { code: "1612", dir: "南下", origin: "台北", dest: "台南", desc: "【1612】南下：台北 → 台南 (經國道3號)" },
      { code: "1612", dir: "北上", origin: "台南", dest: "台北", desc: "【1612】北上：台南 → 台北 (經國道3號)" },
      { code: "1613", dir: "南下", origin: "台北", dest: "屏東", desc: "【1613】南下：台北 → 屏東" },
      { code: "1613", dir: "北上", origin: "屏東", dest: "台北", desc: "【1613】北上：屏東 → 台北" },
      { code: "1839", dir: "南下", origin: "台北", dest: "屏東", desc: "【1839】南下：台北 → 屏東" },
      { code: "1839", dir: "北上", origin: "屏東", dest: "台北", desc: "【1839】北上：屏東 → 台北" },
      { code: "1617", dir: "南下", origin: "台北", dest: "東勢", desc: "【1617】南下：台北 → 豐原 → 東勢" },

    function executeLogin() {
      var u = document.getElementById('loginUser').value.trim();
      var p = document.getElementById('loginPass').value.trim();
      if (u === "2347" && p === "1299") {
        document.getElementById('loginModal').classList.add('hidden');
        sessionStorage.setItem("DISPATCH_AUTH", "OK");
        initConsole();
      } else {
        document.getElementById('loginErrMsg').classList.remove('hidden');
      }
    }

    function initConsole() {
      var datalist = document.getElementById('presetRouteDatalist');
      datalist.innerHTML = "";
      ROUTE_PRESETS.forEach(function(item) {
        var opt = document.createElement('option');
        opt.value = item.code + " (" + item.origin + "→" + item.dest + ")";
        datalist.appendChild(opt);
      });

      populateStationSelects();

      var todayStr = new Date().toISOString().slice(0, 10);
      document.getElementById('navDateInput').value = todayStr;
      document.getElementById('newTripDate').value = todayStr;

      syncAllCloudData();
    }

    function populateStationSelects() {
      var originSel = document.getElementById('newTripOriginSelect');
      var destSel = document.getElementById('newTripDestSelect');
      originSel.innerHTML = "";
      destSel.innerHTML = "";

      ALL_STATIONS.forEach(function(st) {
        var opt1 = document.createElement('option');
        opt1.value = st;
        opt1.innerText = st;
        originSel.appendChild(opt1);

        var opt2 = document.createElement('option');
        opt2.value = st;
        opt2.innerText = st;
        destSel.appendChild(opt2);
      });

      originSel.value = "台北";
      destSel.value = "高雄";
    }

    if (sessionStorage.getItem("DISPATCH_AUTH") === "OK") {
      document.getElementById('loginModal').classList.add('hidden');
      initConsole();
    }

    function handleDateChange() {
      renderSidebarList();
    }

    function handleRouteInputChange() {
      var raw = document.getElementById('newTripRouteInput').value.trim();
      var codeMatch = raw.match(/\d{4}/);
      if (!codeMatch) return;
      var code = codeMatch[0];

      var found = ROUTE_PRESETS.find(function(p) { return p.code === code; });
      if (found) {
        var originSel = document.getElementById('newTripOriginSelect');
        var destSel = document.getElementById('newTripDestSelect');

        originSel.value = found.origin;
        destSel.value = found.dest;

        if (!originSel.value) {
          originSel.value = "自訂站點...";
          document.getElementById('customOriginInput').value = found.origin;
        }
        if (!destSel.value) {
          destSel.value = "自訂站點...";
          document.getElementById('customDestInput').value = found.dest;
        }
        handleStationSelectChange();
      }
    }

    function handleStationSelectChange() {
      var oVal = document.getElementById('newTripOriginSelect').value;
      var dVal = document.getElementById('newTripDestSelect').value;
      var customGroup = document.getElementById('customStationInputGroup');

      if (oVal === "自訂站點..." || dVal === "自訂站點...") {
        customGroup.classList.remove('hidden');
      } else {
        customGroup.classList.add('hidden');
      }
    }

    function syncAllCloudData() {
      document.getElementById('syncTimestamp').innerText = "同步中...";
      var fetchUrl = GAS_API_URL + "?token=" + AUTH_TOKEN;

      fetch(fetchUrl)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.status === "success") {
            globalSchedules = res.schedules || [];
            globalTickets = res.tickets || [];
            
            var now = new Date();
            var timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            document.getElementById('syncTimestamp').innerText = "已同步 " + timeStr;

            renderSidebarList();
          } else {
            document.getElementById('syncTimestamp').innerText = "同步失敗";
          }
        })
        .catch(function(err) {
          document.getElementById('syncTimestamp').innerText = "連線異常";
        });
    }

    function renderSidebarList() {
      var chosenDate = document.getElementById('navDateInput').value;
      var kw = document.getElementById('leftSearchInput').value.trim().toLowerCase();
      var sortMode = document.getElementById('leftSortSelect').value;
      var listContainer = document.getElementById('sidebarTripList');
      listContainer.innerHTML = "";

      var tripsMap = {};

      globalSchedules.filter(function(s) { return s.date === chosenDate; }).forEach(function(s) {
        var key = s.route + "_" + s.tripTime;
        tripsMap[key] = {
          date: s.date,
          route: s.route,
          tripTime: s.tripTime,
          busId: s.busId || "",
          driverId: s.driverId || "",
          delayMinutes: s.delayMinutes || 0,
          actualTime: s.actualTime || "",
          remark: s.remark || "",
          branch: s.route.indexOf("【") !== -1 ? s.route.match(/【.+?】/)[0] : "【主0】",
          normalCount: 0,
          qrCount: 0,
          luggageCount: 0,
          tickets: []
        };
      });

      globalTickets.filter(function(t) { return t.date === chosenDate; }).forEach(function(t) {
        var key = t.route + "_" + t.tripTime;
        if (!tripsMap[key]) {
          tripsMap[key] = {
            date: t.date,
            route: t.route,
            tripTime: t.tripTime,
            busId: "",
            driverId: "",
            delayMinutes: 0,
            actualTime: "",
            remark: "",
            branch: t.route.indexOf("【") !== -1 ? t.route.match(/【.+?】/)[0] : "【主0】",
            normalCount: 0,
            qrCount: 0,
            luggageCount: 0,
            tickets: []
          };
        }
        tripsMap[key].tickets.push(t);
        if (t.type === "行李票") tripsMap[key].luggageCount++;
        else if (t.type === "電子QR票") tripsMap[key].qrCount++;
        else if (t.type !== "空車駛離") tripsMap[key].normalCount++;
      });

      var tripKeys = Object.keys(tripsMap);
      document.getElementById('tripCountSummary').innerText = "共 " + tripKeys.length + " 班次";

      if (tripKeys.length === 0) {
        listContainer.innerHTML = "<div style='text-align:center; color:var(--text-sub); padding:30px 10px; font-size:13px;'>本日尚無排班紀錄<br>請點右上角新增班次</div>";
        resetRightPanel();
        return;
      }

      tripKeys.sort(function(a, b) {
        if (sortMode === "time_asc") return (tripsMap[a].tripTime || "").localeCompare(tripsMap[b].tripTime || "");
        if (sortMode === "time_desc") return (tripsMap[b].tripTime || "").localeCompare(tripsMap[a].tripTime || "");
        return (tripsMap[a].route || "").localeCompare(tripsMap[b].route || "");
      });

      tripKeys.forEach(function(key) {
        var trip = tripsMap[key];
        var textCorpus = (trip.route + " " + trip.tripTime + " " + trip.busId + " " + trip.driverId).toLowerCase();
        if (kw && textCorpus.indexOf(kw) === -1) return;

        var card = document.createElement('div');
        var isDelay = trip.delayMinutes > 0;
        card.className = "trip-nav-card" + (activeTripKey === key ? " active" : "") + (isDelay ? " is-delayed" : " is-ontime");

        var busInfo = trip.busId ? "🚌 " + trip.busId : "🚌 [未指派]";
        if (trip.driverId) busInfo += " (" + trip.driverId + ")";

        var delayText = isDelay ? "<span style='color:var(--accent-amber);'>延誤 +" + trip.delayMinutes + "m</span>" : "<span style='color:var(--accent-emerald);'>準點</span>";

        card.innerHTML = "<div class='t-row-top'>" +
                         "<span class='t-time'>" + trip.tripTime + "</span>" +
                         "<div><span class='t-line-branch'>" + trip.branch + "</span> <span class='t-route-tag'>" + trip.route.replace(/【.+?】/, '') + "</span></div>" +
                         "</div>" +
                         "<div class='t-row-mid'>" +
                         "<span>" + busInfo + "</span>" +
                         "<span>" + delayText + "</span>" +
                         "</div>" +
                         "<div class='t-row-bot'>" +
                         "<span>載客: " + (trip.normalCount + trip.qrCount) + "人 (Q" + trip.qrCount + "/行" + trip.luggageCount + ")</span>" +
                         "<span>" + (trip.actualTime ? "實發 " + trip.actualTime : "未發車") + "</span>" +
                         "</div>";

        card.onclick = function() {
          activeTripKey = key;
          renderSidebarList();
          loadTripToWorkspace(trip);
          document.body.classList.add('mobile-view-detail');
        };

        listContainer.appendChild(card);
      });

      if (!activeTripKey || !tripsMap[activeTripKey]) {
        if (tripKeys.length > 0 && window.innerWidth > 768) {
          activeTripKey = tripKeys[0];
          loadTripToWorkspace(tripsMap[activeTripKey]);
        }
      } else {
        loadTripToWorkspace(tripsMap[activeTripKey]);
      }
    }

    function backToMobileList() {
      document.body.classList.remove('mobile-view-detail');
    }

    function loadTripToWorkspace(trip) {
      if (!trip) return;
      document.getElementById('currentTripHeading').innerText = trip.tripTime + "  " + trip.route.replace(/【.+?】/, '');
      document.getElementById('currentBranchTag').innerText = trip.branch;

      document.getElementById('dispBusId').value = trip.busId || "";
      document.getElementById('dispDriverId').value = trip.driverId || "";
      document.getElementById('dispDelay').value = trip.delayMinutes || 0;
      document.getElementById('dispActualTime').value = trip.actualTime || "";
      document.getElementById('dispRemark').value = trip.remark || "";

      var totalP = trip.normalCount + trip.qrCount;
      document.getElementById('tripSummaryBadge').innerText = "登車 " + totalP + " 人 ｜ 行李 " + trip.luggageCount + " 件";
      document.getElementById('sumNormal').innerText = trip.normalCount;
      document.getElementById('sumQr').innerText = trip.qrCount;
      document.getElementById('sumLuggage').innerText = trip.luggageCount;

      var tBody = document.getElementById('ticketTableBody');
      tBody.innerHTML = "";

      if (trip.tickets.length === 0) {
        tBody.innerHTML = "<tr><td colspan='5' style='text-align: center; color: var(--text-sub); padding: 16px;'>本班次尚未有乘客刷票登車</td></tr>";
        return;
      }

      trip.tickets.forEach(function(t, idx) {
        var tr = document.createElement('tr');
        var badgeClass = "badge-normal";
        if (t.type === "行李票") badgeClass = "badge-luggage";
        else if (t.type === "電子QR票") badgeClass = "badge-qr";

        var isQR = (t.type === "電子QR票");
        var displayCode = isQR ? "電子票 (純計數)" : t.code;

        tr.innerHTML = "<td><b>#" + (idx + 1) + "</b></td>" +
                       "<td><span class='badge " + badgeClass + "'>" + t.type + "</span></td>" +
                       "<td style='font-family:monospace; font-weight:bold; word-break:break-all;'>" + displayCode + "</td>" +
                       "<td style='font-family:monospace; color:var(--text-sub);'>" + (t.scanTime || "-") + "</td>" +
                       "<td>" + (!isQR ? "<button class='btn btn-secondary' style='padding:2px 6px; font-size:10px;' onclick='openQrModal(\"" + t.code + "\", \"" + t.type + "\")'>QR</button>" : "-") + "</td>";

        tBody.appendChild(tr);
      });
    }

    function resetRightPanel() {
      document.getElementById('currentTripHeading').innerText = "尚無選擇班次";
      document.getElementById('currentBranchTag').innerText = "";
      document.getElementById('dispBusId').value = "";
      document.getElementById('dispDriverId').value = "";
      document.getElementById('dispDelay').value = 0;
      document.getElementById('dispActualTime').value = "";
      document.getElementById('dispRemark').value = "";
      document.getElementById('ticketTableBody').innerHTML = "<tr><td colspan='5' style='text-align: center; color: var(--text-sub); padding: 16px;'>無資料</td></tr>";
    }

    function saveCurrentDispatchInfo() {
      if (!activeTripKey) return;
      var chosenDate = document.getElementById('navDateInput').value;
      var parts = activeTripKey.split("_");
      var route = parts[0];
      var tripTime = parts[1];

      var payload = {
        token: AUTH_TOKEN,
        action: "updateSchedule",
        date: chosenDate,
        route: route,
        tripTime: tripTime,
        busId: document.getElementById('dispBusId').value.trim(),
        driverId: document.getElementById('dispDriverId').value.trim(),
        delayMinutes: parseInt(document.getElementById('dispDelay').value) || 0,
        actualTime: document.getElementById('dispActualTime').value.trim(),
        remark: document.getElementById('dispRemark').value.trim()
      };

      var btn = document.getElementById('btnSaveDispatch');
      btn.innerText = "儲存中...";

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function() {
        btn.innerText = "✓ 已儲存";
        setTimeout(function() { btn.innerText = "💾 儲存"; }, 1500);
        
        var found = globalSchedules.find(function(s) { return s.date === chosenDate && s.route === route && s.tripTime === tripTime; });
        if (found) {
          Object.assign(found, payload);
        } else {
          globalSchedules.push(payload);
        }
        renderSidebarList();
      }).catch(function(err) {
        alert("儲存失敗：" + err);
        btn.innerText = "💾 儲存";
      });
    }

    function confirmDeleteCurrentTrip() {
      if (!activeTripKey) return;
      var chosenDate = document.getElementById('navDateInput').value;
      var parts = activeTripKey.split("_");
      var route = parts[0];
      var tripTime = parts[1];

      var msg = "⚠️ 確定要刪除以下班次嗎？\n\n" +
                "日期：" + chosenDate + "\n" +
                "路線：" + route + "\n" +
                "時間：" + tripTime + "\n\n" +
                "※ 注意：此操作將一併清除該班次在雲端 Schedules 與 Tickets 所有的排班及乘客刷票紀錄！";

      if (!confirm(msg)) return;

      var payload = {
        token: AUTH_TOKEN,
        action: "deleteSchedule",
        date: chosenDate,
        route: route,
        tripTime: tripTime
      };

      var btn = document.getElementById('btnDeleteTrip');
      btn.innerText = "刪除中...";

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function() {
        globalSchedules = globalSchedules.filter(function(s) {
          return !(s.date === chosenDate && s.route === route && s.tripTime === tripTime);
        });
        globalTickets = globalTickets.filter(function(t) {
          return !(t.date === chosenDate && t.route === route && t.tripTime === tripTime);
        });

        activeTripKey = "";
        btn.innerText = "🗑️ 刪除";
        backToMobileList();
        renderSidebarList();
        alert("班次已成功從雲端與本地端刪除！");
      }).catch(function(err) {
        alert("刪除失敗：" + err);
        btn.innerText = "🗑️ 刪除";
      });
    }

    function openCreateTripModal(mode) {
      createModalMode = mode;
      document.getElementById('createModalTitle').innerText = (mode === 'single') ? "新增單一班次排班" : "批次快速預排班次";
      if (mode === 'single') {
        document.getElementById('singleTimeGroup').classList.remove('hidden');
        document.getElementById('batchTimeGroup').classList.add('hidden');
      } else {
        document.getElementById('singleTimeGroup').classList.add('hidden');
        document.getElementById('batchTimeGroup').classList.remove('hidden');
      }
      handleStationSelectChange();
      document.getElementById('createTripModal').classList.remove('hidden');
    }

    function closeCreateTripModal() {
      document.getElementById('createTripModal').classList.add('hidden');
    }

    function executeCreateTrip() {
      var targetDate = document.getElementById('newTripDate').value;
      var branchVal = document.getElementById('newTripBranch').value;
      var rawRoute = document.getElementById('newTripRouteInput').value.trim();
      
      var oVal = document.getElementById('newTripOriginSelect').value;
      var dVal = document.getElementById('newTripDestSelect').value;

      var origin = (oVal === "自訂站點...") ? document.getElementById('customOriginInput').value.trim() : oVal;
      var dest = (dVal === "自訂站點...") ? document.getElementById('customDestInput').value.trim() : dVal;

      var codeMatch = rawRoute.match(/\d{4}/);
      var routeCode = codeMatch ? codeMatch[0] : (rawRoute || "專車");

      if (!targetDate || !origin || !dest) {
        alert("請確認發車日期與起訖站皆已設定！");
        return;
      }

      var fullRouteName = branchVal + " " + routeCode + " " + origin + "→" + dest;

      var timesToCreate = [];
      if (createModalMode === 'single') {
        var st = document.getElementById('newSingleTime').value;
        if (!st) { alert("請指定發車時間！"); return; }
        timesToCreate.push(st);
      } else {
        var rawTokens = document.getElementById('newBatchTimes').value.trim().split(/[\s,，\n]+/);
        rawTokens.forEach(function(token) {
          token = token.replace(/[^0-9:]/g, "");
          if (token.length === 4 && token.indexOf(":") === -1) {
            token = token.slice(0, 2) + ":" + token.slice(2, 4);
          }
          if (/^([01]\d|2[0-3]):([0-5]\d)$/.test(token)) {
            if (timesToCreate.indexOf(token) === -1) timesToCreate.push(token);
          }
        });
      }

      if (timesToCreate.length === 0) {
        alert("未輸入有效的發車時間格式！");
        return;
      }

      var uploadPayloads = timesToCreate.map(function(tStr) {
        return {
          token: AUTH_TOKEN,
          action: "updateSchedule",
          date: targetDate,
          route: fullRouteName,
          tripTime: tStr,
          busId: "",
          driverId: "",
          delayMinutes: 0,
          actualTime: "",
          remark: "系統建立排班"
        };
      });

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(uploadPayloads)
      }).then(function() {
        uploadPayloads.forEach(function(item) { globalSchedules.push(item); });
        closeCreateTripModal();
        document.getElementById('navDateInput').value = targetDate;
        renderSidebarList();
        alert("成功建立 " + uploadPayloads.length + " 筆班次排班！");
      }).catch(function(err) {
        alert("建立失敗：" + err);
      });
    }

    function openQrModal(code, type) {
      var wrapper = document.getElementById('qrWrapper');
      var typeTag = document.getElementById('qrTicketTypeTag');
      var codeText = document.getElementById('qrTicketCode');
      var container = document.getElementById('qrCanvasContainer');
      container.innerHTML = "";

      wrapper.className = "qr-ticket-card";
      if (type === "行李票") {
        wrapper.classList.add("type-luggage");
        typeTag.innerText = "[行李票 24碼]";
        typeTag.style.color = "#c084fc";
      } else {
        typeTag.innerText = "[一般票 24碼]";
        typeTag.style.color = "#f8fafc";
      }

      codeText.innerText = code;
      var canvas = document.createElement('canvas');
      container.appendChild(canvas);
      SimpleQR.draw(code, canvas, 180);

      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === "Escape") {
        closeCreateTripModal();
        closeQrModal();
      }
    });
  </script>
</body>
</html>
