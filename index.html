<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班次驗票紀錄查詢中心</title>
  <style>
    :root {
      --primary: #b45309;
      --primary-light: #fffbeb;
      --bg: #fcfaf8;
      --surface: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --sub: #78716c;
      --card-hover: #f5f5f4;

      --badge-normal-bg: #e7e5e4;
      --badge-normal-text: #292524;
      --badge-luggage-bg: #f3e8ff;
      --badge-luggage-text: #7e22ce;
      --badge-qr-bg: #ecfccb;
      --badge-qr-text: #3f6212;
      --badge-empty-bg: #fef3c7;
      --badge-empty-text: #92400e;
    }

    body.dark-mode {
      --primary: #fbbf24;
      --primary-light: #292524;
      --bg: #121212;
      --surface: #1e1e1e;
      --border: #333333;
      --text: #f5f5f4;
      --sub: #a8a29e;
      --card-hover: #262626;

      --badge-normal-bg: #2e2e2e;
      --badge-normal-text: #f5f5f4;
      --badge-luggage-bg: #581c87;
      --badge-luggage-text: #f3e8ff;
      --badge-qr-bg: #365314;
      --badge-qr-text: #ecfccb;
      --badge-empty-bg: #78350f;
      --badge-empty-text: #fde68a;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--surface); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); transition: background 0.3s, border 0.3s; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-title { font-size: 22px; font-weight: 800; color: var(--primary); margin: 0; }
    .theme-toggle-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text); padding: 6px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .search-mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { padding: 8px 16px; border: none; background: transparent; color: var(--sub); font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .tab-btn.active { background: var(--primary); color: #fff; }

    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px; }
    label { font-size: 13px; font-weight: bold; color: var(--sub); display: block; margin-bottom: 6px; }
    input[type="date"], input[type="text"], select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-weight: bold; background: var(--surface); color: var(--text); outline: none; }

    .btn { padding: 10px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn:active { filter: brightness(0.9); }
    .btn-secondary { background: var(--sub); color: #fff; }

    /* 統計摘要 */
    .summary-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .summary-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
    .summary-val { font-size: 26px; font-weight: bold; color: var(--primary); margin-top: 4px; }

    /* 第一層：班次清單卡片 (一台車一個匡) */
    .trip-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .trip-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    .trip-card:hover { transform: translateY(-2px); border-color: var(--primary); background: var(--card-hover); }
    
    .trip-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .trip-route-name { font-size: 18px; font-weight: 800; color: var(--text); }
    .trip-time-badge { font-family: monospace; font-size: 17px; font-weight: 900; color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 6px; }

    .trip-card-mid { font-size: 14px; font-weight: bold; color: var(--text); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.03); padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; }
    .trip-card-bottom { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .badge-normal { background: var(--badge-normal-bg); color: var(--badge-normal-text); }
    .badge-luggage { background: var(--badge-luggage-bg); color: var(--badge-luggage-text); }
    .badge-qr { background: var(--badge-qr-bg); color: var(--badge-qr-text); }
    .badge-empty { background: var(--badge-empty-bg); color: var(--badge-empty-text); }

    /* 第二層：班次細項與票券彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-box {
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    .modal-header { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; }
    .modal-scroll-area { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    
    .ticket-row-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; }
    .ticket-row-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .ticket-row-code { font-family: monospace; font-size: 13px; font-weight: bold; background: rgba(0,0,0,0.04); padding: 4px 6px; border-radius: 4px; word-break: break-all; }
    
    #qrCanvasContainer { display: flex; justify-content: center; align-items: center; margin: 10px 0; }
    #qrCanvasContainer canvas { border: 6px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 6px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="card">
      <div class="header-bar">
        <h1 class="header-title">班次驗票紀錄查詢中心</h1>
        <button class="theme-toggle-btn" onclick="toggleThemeMode()">切換深色模式</button>
      </div>

      <div class="search-mode-tabs">
        <button class="tab-btn active" id="tabTrip" onclick="switchSearchMode('trip')">依班次日期查詢</button>
        <button class="tab-btn" id="tabCode" onclick="switchSearchMode('code')">依票號反查班次</button>
      </div>

      <div id="panelTrip">
        <div class="filter-grid">
          <div>
            <label>查詢日期：</label>
            <input type="date" id="queryDate">
          </div>
          <div>
            <label>選擇路線：</label>
            <select id="routeSelect">
              <option value="ALL">全部路線</option>
              <option value="台中">台中</option>
              <option value="朝專">朝專</option>
              <option value="宜蘭">宜蘭</option>
              <option value="宜直">宜直</option>
              <option value="機轉">機轉</option>
              <option value="99">99 (測試)</option>
            </select>
          </div>
          <div>
            <label>排序方式：</label>
            <select id="sortModeSelect">
              <option value="time">依發車時間排序</option>
              <option value="route">依路線分組排序</option>
            </select>
          </div>
        </div>
      </div>

      <div id="panelCode" class="hidden">
        <div style="margin-bottom: 14px;">
          <label>輸入票號 (完整或局部號碼)：</label>
          <input type="text" id="queryCodeInput" placeholder="請輸入 24 碼票號或部分關鍵數字">
        </div>
      </div>

      <button class="btn" onclick="executeSearch()">立即查詢班次</button>
    </div>

    <!-- 數據摘要 -->
    <div class="summary-box" id="summaryBox" style="display:none;">
      <div class="summary-card">
        <label>符合班次數</label>
        <div class="summary-val" id="sumTrips">0</div>
      </div>
      <div class="summary-card">
        <label>總乘客人數 (人頭)</label>
        <div class="summary-val" id="sumPassengers">0</div>
      </div>
      <div class="summary-card">
        <label>總行李件數</label>
        <div class="summary-val" id="sumLuggage">0</div>
      </div>
    </div>

    <!-- 第一層：只顯示班次卡片 -->
    <div class="card">
      <h3 style="margin-top:0;">班次列表 (點擊任一班次查看該車所有票券與 QR)</h3>
      <div id="resultContent" style="color: var(--sub); text-align: center; padding: 30px 0;">請設定條件後點擊上方按鈕開始查詢</div>
    </div>

  </div>

  <!-- 第二層：該班次內部票券細項彈窗 -->
  <div id="tripDetailModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="margin:0;" id="modalTripTitle">班次詳細內容</h3>
        <div style="font-size:13px; color:var(--sub); margin-top:4px;" id="modalTripSubTitle">發車時間 ｜ 路線</div>
      </div>

      <div class="modal-scroll-area" id="modalTicketList"></div>

      <button class="btn btn-secondary" style="width:100%; margin-top:14px;" onclick="closeTripDetailModal()">關閉班次清單</button>
    </div>
  </div>

  <!-- 單張票券 QR 放大彈窗 -->
  <div id="singleQrModal" class="modal-overlay hidden" style="z-index: 10000;">
    <div class="modal-box" style="max-width:340px; text-align:center;">
      <h3 style="margin-top:0;">票券 QR Code</h3>
      <div id="qrCanvasContainer"></div>
      <div style="font-family:monospace; font-weight:bold; font-size:13px; word-break:break-all; margin-bottom:12px;" id="singleQrCodeText"></div>
      <button class="btn btn-secondary" style="width:100%;" onclick="closeSingleQrModal()">返回班次票券</button>
    </div>
  </div>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbwxWZ8uKHWxO1Z1ngJ6hJZJOHlMrzz_21AcH5uuL4ALpfrLs8-6x-rXVlplspkKLLWR/exec";
    var AUTH_TOKEN = "8888"; 
    var currentSearchMode = "trip";

    // 輕量 QR 核心
    var SimpleQR = (function() {
      var PAD0 = 0xEC, PAD1 = 0x11;
      var RS_BLOCK_TABLE = [
        [1,26,19],[1,26,16],[1,26,13],[1,26,9],
        [1,44,34],[1,44,28],[1,44,22],[1,44,16],
        [1,70,55],[1,70,44],[2,35,17],[2,35,13],
        [1,100,80],[2,50,32],[2,50,24],[4,25,9]
      ];
      var PATTERN_POSITION_TABLE = [[],[6,18],[6,22],[6,26],[6,30]];
      var EXP_TABLE = new Array(256), LOG_TABLE = new Array(256);
      for (var i = 0; i < 8; i++) EXP_TABLE[i] = 1 << i;
      for (var i = 8; i < 256; i++) EXP_TABLE[i] = EXP_TABLE[i - 4] ^ EXP_TABLE[i - 5] ^ EXP_TABLE[i - 6] ^ EXP_TABLE[i - 8];
      for (var i = 0; i < 255; i++) LOG_TABLE[EXP_TABLE[i]] = i;

      function gexp(n) { while (n < 0) n += 255; while (n >= 255) n -= 255; return EXP_TABLE[n]; }
      function glog(n) { if (n < 1) throw new Error("glog(" + n + ")"); return LOG_TABLE[n]; }

      function Poly(num, shift) {
        var offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      }
      Poly.prototype.multiply = function(e) {
        var num = new Array(this.num.length + e.num.length - 1);
        for (var i = 0; i < num.length; i++) num[i] = 0;
        for (var i = 0; i < this.num.length; i++) {
          for (var j = 0; j < e.num.length; j++) num[i + j] ^= gexp(glog(this.num[i]) + glog(e.num[j]));
        }
        return new Poly(num, 0);
      };
      Poly.prototype.mod = function(e) {
        if (this.num.length - e.num.length < 0) return this;
        var ratio = glog(this.num[0]) - glog(e.num[0]);
        var num = new Array(this.num.length);
        for (var i = 0; i < this.num.length; i++) num[i] = this.num[i];
        for (var i = 0; i < e.num.length; i++) num[i] ^= gexp(glog(e.num[i]) + ratio);
        return new Poly(num, 0).mod(e);
      };

      function draw(text, canvas, size) {
        var typeNumber = 3;
        var rsBlock = RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
        var totalDataCount = rsBlock[0] * rsBlock[2];
        
        var buffer = [];
        var bitLength = 0;
        function putBit(b) {
          var bufIndex = Math.floor(bitLength / 8);
          if (buffer.length <= bufIndex) buffer.push(0);
          if (b) buffer[bufIndex] |= (0x80 >>> (bitLength % 8));
          bitLength++;
        }
        function put(num, length) {
          for (var i = 0; i < length; i++) putBit(((num >>> (length - i - 1)) & 1) == 1);
        }
        put(4, 4);
        put(text.length, 8);
        for (var i = 0; i < text.length; i++) put(text.charCodeAt(i), 8);
        
        if (bitLength + 4 <= totalDataCount * 8) put(0, 4);
        while (bitLength % 8 != 0) putBit(false);
        while (true) {
          if (bitLength >= totalDataCount * 8) break;
          put(PAD0, 8);
          if (bitLength >= totalDataCount * 8) break;
          put(PAD1, 8);
        }

        var ecCount = rsBlock[1] - rsBlock[2];
        var rsPoly = new Poly([1], 0);
        for (var i = 0; i < ecCount; i++) rsPoly = rsPoly.multiply(new Poly([1, gexp(i)], 0));
        var rawPoly = new Poly(buffer, rsPoly.num.length - 1);
        var modPoly = rawPoly.mod(rsPoly);
        var ecData = new Array(rsPoly.num.length - 1);
        for (var i = 0; i < ecData.length; i++) {
          var modIndex = i + modPoly.num.length - ecData.length;
          ecData[i] = (modIndex >= 0) ? modPoly.num[modIndex] : 0;
        }
        var finalData = buffer.concat(ecData);

        var moduleCount = typeNumber * 4 + 17;
        var modules = new Array(moduleCount);
        for (var r = 0; r < moduleCount; r++) {
          modules[r] = new Array(moduleCount);
          for (var c = 0; c < moduleCount; c++) modules[r][c] = null;
        }

        function setPattern(row, col) {
          for (var r = -1; r <= 7; r++) {
            if (row + r <= -1 || moduleCount <= row + r) continue;
            for (var c = -1; c <= 7; c++) {
              if (col + c <= -1 || moduleCount <= col + c) continue;
              if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                modules[row + r][col + c] = true;
              } else {
                modules[row + r][col + c] = false;
              }
            }
          }
        }
        setPattern(0, 0);
        setPattern(moduleCount - 7, 0);
        setPattern(0, moduleCount - 7);

        var pos = PATTERN_POSITION_TABLE[typeNumber - 1];
        for (var i = 0; i < pos.length; i++) {
          for (var j = 0; j < pos.length; j++) {
            var row = pos[i], col = pos[j];
            if (modules[row][col] != null) continue;
            for (var r = -2; r <= 2; r++) {
              for (var c = -2; c <= 2; c++) modules[row + r][col + c] = (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0));
            }
          }
        }

        for (var r = 8; r < moduleCount - 8; r++) if (modules[r][6] == null) modules[r][6] = (r % 2 == 0);
        for (var c = 8; c < moduleCount - 8; c++) if (modules[6][c] == null) modules[6][c] = (c % 2 == 0);

        var typeBits = 0x5412;
        for (var i = 0; i < 15; i++) {
          var mod = ((typeBits >> i) & 1) == 1;
          if (i < 6) modules[i][8] = mod;
          else if (i < 8) modules[i + 1][8] = mod;
          else modules[moduleCount - 15 + i][8] = mod;

          if (i < 8) modules[8][moduleCount - i - 1] = mod;
          else if (i < 9) modules[8][15 - i - 1 + 1] = mod;
          else modules[8][15 - i - 1] = mod;
        }
        modules[moduleCount - 8][8] = true;

        var inc = -1, row = moduleCount - 1, bitIdx = 7, byteIdx = 0;
        for (var col = moduleCount - 1; col > 0; col -= 2) {
          if (col == 6) col--;
          while (true) {
            for (var c = 0; c < 2; c++) {
              if (modules[row][col - c] == null) {
                var dark = false;
                if (byteIdx < finalData.length) dark = (((finalData[byteIdx] >>> bitIdx) & 1) == 1);
                if ((row + (col - c)) % 2 == 0) dark = !dark;
                modules[row][col - c] = dark;
                bitIdx--;
                if (bitIdx == -1) { byteIdx++; bitIdx = 7; }
              }
            }
            row += inc;
            if (row < 0 || moduleCount <= row) { row -= inc; inc = -inc; break; }
          }
        }

        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        var tileW = size / moduleCount;
        var tileH = size / moduleCount;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = "#000000";
        for (var r = 0; r < moduleCount; r++) {
          for (var c = 0; c < moduleCount; c++) {
            if (modules[r][c]) ctx.fillRect(Math.round(c * tileW), Math.round(r * tileH), Math.ceil(tileW), Math.ceil(tileH));
          }
        }
      }
      return { draw: draw };
    })();

    function initTheme() {
      var savedTheme = localStorage.getItem("PDA_THEME") || "light";
      if (savedTheme === "dark") document.body.classList.add("dark-mode");
    }
    initTheme();

    function toggleThemeMode() {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem("PDA_THEME", document.body.classList.contains("dark-mode") ? "dark" : "light");
    }

    document.getElementById('queryDate').value = new Date().toISOString().slice(0, 10);

    function formatRouteName(name) {
      if (!name) return "未指定";
      if (name === "99") return "99 (測試)";
      return name;
    }

    function switchSearchMode(mode) {
      currentSearchMode = mode;
      document.getElementById('tabTrip').className = "tab-btn " + (mode === 'trip' ? 'active' : '');
      document.getElementById('tabCode').className = "tab-btn " + (mode === 'code' ? 'active' : '');

      if (mode === 'trip') {
        document.getElementById('panelTrip').classList.remove('hidden');
        document.getElementById('panelCode').classList.add('hidden');
      } else {
        document.getElementById('panelTrip').classList.add('hidden');
        document.getElementById('panelCode').classList.remove('hidden');
      }
    }

    function executeSearch() {
      var container = document.getElementById('resultContent');
      var summaryBox = document.getElementById('summaryBox');

      container.innerHTML = "<div style='text-align:center; padding:30px; color:var(--sub);'>正在讀取雲端資料庫中...</div>";
      summaryBox.style.display = "none";

      var fetchUrl = GAS_API_URL + "?token=" + AUTH_TOKEN;

      fetch(fetchUrl)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.status !== "success") {
            container.innerHTML = "<div style='color:#b91c1c;'>讀取失敗：" + (res.message || "未知錯誤") + "</div>";
            return;
          }

          var allData = res.data || [];
          var filtered = [];

          if (currentSearchMode === "trip") {
            var dateVal = document.getElementById('queryDate').value;
            var routeVal = document.getElementById('routeSelect').value;

            filtered = allData.filter(function(row) {
              var matchDate = (row.date === dateVal);
              var matchRoute = (routeVal === "ALL" || row.route === routeVal);
              return matchDate && matchRoute;
            });
          } else {
            var keyword = document.getElementById('queryCodeInput').value.trim();
            if (!keyword) {
              alert("請輸入要查詢的票號！");
              container.innerHTML = "<div style='color:var(--sub);'>請輸入票號後執行查詢</div>";
              return;
            }

            // 先找出有包含此票號的紀錄
            var matchedCodes = allData.filter(function(row) {
              return row.code && row.code.indexOf(keyword) !== -1;
            });

            // 再找出這些票號隸屬的「整台車/整班次」的所有票券
            var targetTrips = {};
            matchedCodes.forEach(function(m) {
              targetTrips[m.date + "_" + m.route + "_" + m.tripTime] = true;
            });

            filtered = allData.filter(function(row) {
              return targetTrips[row.date + "_" + row.route + "_" + row.tripTime];
            });
          }

          if (filtered.length === 0) {
            container.innerHTML = "<div style='text-align:center; padding:30px; color:var(--sub);'>查無符合條件的班次紀錄</div>";
            return;
          }

          // 彙整成「班次維度 (一班車一個實體)」
          var tripsMap = {};
          var totalP = 0, totalL = 0;

          filtered.forEach(function(row) {
            var tripKey = row.date + "_" + row.route + "_" + row.tripTime;
            if (!tripsMap[tripKey]) {
              tripsMap[tripKey] = {
                date: row.date,
                route: row.route,
                tripTime: row.tripTime,
                normalCount: 0,
                qrCount: 0,
                luggageCount: 0,
                isEmpty: false,
                tickets: []
              };
            }

            tripsMap[tripKey].tickets.push(row);

            if (row.type === "行李票") {
              tripsMap[tripKey].luggageCount++;
              totalL++;
            } else if (row.type === "空車駛離") {
              tripsMap[tripKey].isEmpty = true;
            } else {
              if (row.type === "電子QR票") tripsMap[tripKey].qrCount++;
              else tripsMap[tripKey].normalCount++;
              totalP++;
            }
          });

          var tripKeys = Object.keys(tripsMap);
          document.getElementById('sumTrips').innerText = tripKeys.length;
          document.getElementById('sumPassengers').innerText = totalP;
          document.getElementById('sumLuggage').innerText = totalL;
          summaryBox.style.display = "grid";

          renderTripCards(tripsMap, container);
        })
        .catch(function(err) {
          container.innerHTML = "<div style='color:#b91c1c;'>連線錯誤：" + err + "</div>";
        });
    }

    // 第一層：渲染班次卡片清單
    function renderTripCards(tripsMap, container) {
      container.innerHTML = "";
      var grid = document.createElement('div');
      grid.className = "trip-list-grid";

      var tripKeys = Object.keys(tripsMap);

      // 排序邏輯
      var sortMode = document.getElementById('sortModeSelect').value;
      tripKeys.sort(function(a, b) {
        if (sortMode === "route") {
          var rComp = (tripsMap[a].route || "").localeCompare(tripsMap[b].route || "");
          if (rComp !== 0) return rComp;
        }
        return (tripsMap[a].tripTime || "").localeCompare(tripsMap[b].tripTime || "");
      });

      tripKeys.forEach(function(key) {
        var trip = tripsMap[key];
        var card = document.createElement('div');
        card.className = "trip-card";

        var statsHtml = "";
        if (trip.isEmpty) {
          statsHtml = "<span class='badge badge-empty'>空車駛離 (0人發車)</span>";
        } else {
          statsHtml = "<span>" + trip.normalCount + " / Q" + trip.qrCount + " / 行" + trip.luggageCount + "</span>" +
                      "<span style='color:var(--sub); font-size:12px;'>共 " + (trip.normalCount + trip.qrCount) + " 人</span>";
        }

        card.innerHTML = "<div class='trip-card-top'>" +
                         "<span class='trip-route-name'>" + formatRouteName(trip.route) + "</span>" +
                         "<span class='trip-time-badge'>" + trip.tripTime + "</span>" +
                         "</div>" +
                         "<div class='trip-card-mid'>" + statsHtml + "</div>" +
                         "<div class='trip-card-bottom'>" +
                         "<span>日期: " + trip.date + "</span>" +
                         "<span style='color:var(--primary); font-weight:bold;'>點擊查看明細 ➔</span>" +
                         "</div>";

        card.onclick = function() {
          openTripDetailModal(trip);
        };

        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    // 第二層：點開班次彈窗，展示該車所有票券
    function openTripDetailModal(trip) {
      document.getElementById('modalTripTitle').innerText = formatRouteName(trip.route) + " ｜ " + trip.tripTime;
      document.getElementById('modalTripSubTitle').innerText = "發車日期：" + trip.date + " ｜ 總票數：" + trip.tickets.length + " 筆";

      var listContainer = document.getElementById('modalTicketList');
      listContainer.innerHTML = "";

      if (trip.isEmpty) {
        listContainer.innerHTML = "<div style='text-align:center; padding:30px; color:var(--sub); font-weight:bold;'>此班次為【空車駛離】，無旅客票券</div>";
      } else {
        trip.tickets.forEach(function(t, idx) {
          var item = document.createElement('div');
          item.className = "ticket-row-item";

          var badgeClass = "badge-normal";
          if (t.type === "行李票") badgeClass = "badge-luggage";
          else if (t.type === "電子QR票") badgeClass = "badge-qr";

          var isQRCount = (t.type === "電子QR票");
          var displayCode = isQRCount ? "電子票 (純計數無24碼)" : t.code;

          item.innerHTML = "<div class='ticket-row-header'>" +
                           "<div><span class='badge " + badgeClass + "'>" + t.type + "</span> <b>#" + (idx + 1) + "</b></div>" +
                           "<span style='font-family:monospace; color:var(--sub);'>" + (t.scanTime || "") + "</span>" +
                           "</div>" +
                           "<div class='ticket-row-code' " + (!isQRCount ? "style='cursor:pointer; color:var(--primary);'" : "") + ">" +
                           displayCode + (!isQRCount ? " <span style='font-size:11px;'>(點擊看QR)</span>" : "") +
                           "</div>";

          if (!isQRCount && t.code) {
            item.onclick = function() {
              openSingleQrModal(t.code);
            };
          }

          listContainer.appendChild(item);
        });
      }

      document.getElementById('tripDetailModal').classList.remove('hidden');
    }

    function closeTripDetailModal() {
      document.getElementById('tripDetailModal').classList.add('hidden');
    }

    function openSingleQrModal(code) {
      document.getElementById('singleQrCodeText').innerText = code;
      var container = document.getElementById('qrCanvasContainer');
      container.innerHTML = "";
      var canvas = document.createElement('canvas');
      container.appendChild(canvas);
      SimpleQR.draw(code, canvas, 200);
      document.getElementById('singleQrModal').classList.remove('hidden');
    }

    function closeSingleQrModal() {
      document.getElementById('singleQrModal').classList.add('hidden');
    }

    // 點擊彈窗外層關閉
    document.getElementById('tripDetailModal').addEventListener('click', function(e) {
      if (e.target.id === 'tripDetailModal') closeTripDetailModal();
    });
    document.getElementById('singleQrModal').addEventListener('click', function(e) {
      if (e.target.id === 'singleQrModal') closeSingleQrModal();
    });
  </script>
</body>
</html>
